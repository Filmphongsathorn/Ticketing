version: '3.8'

services:
  # 🐘 PostgreSQL for Catalog & Orders
  postgres:
    image: postgres:15-alpine
    container_name: stagefront-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: stagefront
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: stagefront_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stagefront-network

  # 🛑 Redis for Redlock (Inventory) & Caching
  redis:
    image: redis:7-alpine
    container_name: stagefront-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "redispass123"
    volumes:
      - redis_data:/data
    networks:
      - stagefront-network

  # 📬 Zookeeper (Dependency for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: stagefront-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - stagefront-network

  # 🚀 Kafka for Event Sourcing & Messaging
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: stagefront-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - stagefront-network

volumes:
  postgres_data:
  redis_data:

networks:
  stagefront-network:
    driver: bridge
